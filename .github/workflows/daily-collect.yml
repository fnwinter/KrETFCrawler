name: Daily ETF collect

on:
  schedule:
    # 매일 18:00 KST (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collection scripts
        run: |
          python script/etf_list.py
          python script/update_etfs.py
          python script/etf_keyword.py

      - name: Commit and push changes
        run: |
          git config user.name "kretf-bot"
          git config user.email "kretf-bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update ETF data"
          git push
